kind = "web"
previewPath = "/"
title = "ECE Lab Assistant"
description = "A beginner-friendly static toolkit foundation for Electronics and Communication Engineering students, with placeholder sections ready for future calculators."
version = "1.0.0"
id = "artifacts/ece-lab-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21059

[services.development]
run = "pnpm --filter @workspace/ece-lab-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ece-lab-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/ece-lab-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21059"
BASE_PATH = "/"
